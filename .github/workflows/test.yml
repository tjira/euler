name: Test

on:
  push:
    branches:
      - 'master'

permissions:
  contents: write

jobs:
  test:
    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      MISE_DATA_DIR: ${{github.workspace}}/.mise

      MISE_CACHE_DIR: ${{github.workspace}}/.mise/cache
      MISE_STATE_DIR: ${{github.workspace}}/.mise/state

    steps:
      - uses: actions/checkout@v7

      - name: Setup Mise
        env:
          TEMP: ${{runner.temp}}
        uses: jdx/mise-action@v5

      - name: Setup Fortran
        if: runner.os == 'macOS'
        uses: fortran-lang/setup-fortran@v1

      - name: Setup the Environment
        run: make setup

      - name: Build the Programs
        run: make

      - name: Run the Tests
        run: make test
